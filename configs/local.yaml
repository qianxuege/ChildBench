# Free models on this machine: one Ollama server per port, so each is easy to look at.
# Start the servers with OLLAMA_KEEP_ALIVE=30s OLLAMA_MAX_LOADED_MODELS=1 and, per port:
#   OLLAMA_HOST=127.0.0.1:11501 OLLAMA_CONTEXT_LENGTH=4096 ollama serve
#   OLLAMA_HOST=127.0.0.1:11502 OLLAMA_CONTEXT_LENGTH=8192 ollama serve
#   OLLAMA_HOST=127.0.0.1:11503 OLLAMA_CONTEXT_LENGTH=16384 ollama serve
# Models: ollama pull gemma3:270m && ollama pull gemma4:e4b && ollama pull qwen3.5:9b
#
# On 24 GB the two big models don't fit together. The short keep-alive lets the child's model
# unload before scoring starts. The judge needs the longer context or its prompt gets cut off.
#
# The judge is from a different family than the chatbots being scored.
# Thinking is off everywhere: it counts against max_tokens and produced empty replies.
# gemma3:270m has no thinking mode, so it doesn't need the setting.
run_name: local
rubric: rubrics/v0.yaml
scenarios: scenarios/**/*.yaml
seeds: [1]
guardrails: {enforce: true, allow_unreviewed: true, audit_rate: 0.10}
temperatures: {child: 0.9, agent: 0.7, judge: 0.0}
roles:
  child_generator: {backend: openai_compat, base_url: "http://127.0.0.1:11502/v1", model: "gemma4:e4b", reasoning_effort: none}
  child_reviewer:  {backend: openai_compat, base_url: "http://127.0.0.1:11502/v1", model: "gemma4:e4b", reasoning_effort: none}
  judge:           {backend: openai_compat, base_url: "http://127.0.0.1:11503/v1", model: "qwen3.5:9b", reasoning_effort: none}
agents:
  - name: gemma-270m
    model: {backend: openai_compat, base_url: "http://127.0.0.1:11501/v1", model: "gemma3:270m"}
  - name: gemma4-e4b-nothink
    model: {backend: openai_compat, base_url: "http://127.0.0.1:11502/v1", model: "gemma4:e4b", reasoning_effort: none}
