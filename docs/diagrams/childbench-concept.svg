<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1090 310" width="1090" height="310" role="img" font-family="Helvetica, Arial, sans-serif"><title>ChildBench pipeline</title><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#44546a"/></marker></defs><rect width="1090" height="310" fill="#fff"/><rect x="205" y="44" width="260" height="220" rx="14" fill="none" stroke="#c79225" stroke-width="1.5" stroke-dasharray="6 5"/><text x="335" y="34" text-anchor="middle" font-size="13" fill="#8a6410">Guardrails check every child line</text><rect x="665" y="44" width="215" height="150" rx="14" fill="none" stroke="#c79225" stroke-width="1.5" stroke-dasharray="6 5"/><text x="772" y="34" text-anchor="middle" font-size="13" fill="#8a6410">Quotes and scores checked by code</text><rect x="15" y="75" width="160" height="100" rx="10" fill="#f3f5f7" stroke="#8a97a6" stroke-width="1.5"/><text x="95.0" y="101" text-anchor="middle" font-size="16" font-weight="700" fill="#1b2735">Scenario</text><text x="95.0" y="123" text-anchor="middle" font-size="13" fill="#3a4859">age, lines, key facts</text><text x="95.0" y="141" text-anchor="middle" font-size="13" fill="#3a4859">5 situations,</text><text x="95.0" y="159" text-anchor="middle" font-size="13" fill="#3a4859">controls, everyday</text><rect x="225" y="75" width="220" height="100" rx="10" fill="#e8f1fb" stroke="#4a86c5" stroke-width="1.5"/><text x="335.0" y="101" text-anchor="middle" font-size="16" font-weight="700" fill="#1b2735">Pretend child</text><text x="335.0" y="123" text-anchor="middle" font-size="13" fill="#3a4859">AI agent plays the child,</text><text x="335.0" y="141" text-anchor="middle" font-size="13" fill="#3a4859">follows the script,</text><text x="335.0" y="159" text-anchor="middle" font-size="13" fill="#3a4859">reacts to the chatbot</text><rect x="225" y="186" width="220" height="64" rx="10" fill="#f3f5f7" stroke="#8a97a6" stroke-width="1.5"/><text x="335.0" y="212" text-anchor="middle" font-size="16" font-weight="700" fill="#1b2735">Orchestrator</text><text x="335.0" y="234" text-anchor="middle" font-size="13" fill="#3a4859">plain code, saves everything</text><rect x="500" y="75" width="145" height="100" rx="10" fill="#fff5df" stroke="#c79225" stroke-width="1.5"/><text x="572.5" y="101" text-anchor="middle" font-size="16" font-weight="700" fill="#1b2735">Chatbot</text><text x="572.5" y="123" text-anchor="middle" font-size="13" fill="#3a4859">under test</text><text x="572.5" y="141" text-anchor="middle" font-size="13" fill="#3a4859">replies never</text><text x="572.5" y="159" text-anchor="middle" font-size="13" fill="#3a4859">edited</text><rect x="685" y="75" width="175" height="100" rx="10" fill="#f2ecfa" stroke="#7d5bb0" stroke-width="1.5"/><text x="772.5" y="101" text-anchor="middle" font-size="16" font-weight="700" fill="#1b2735">Judge</text><text x="772.5" y="123" text-anchor="middle" font-size="13" fill="#3a4859">AI agent scores the</text><text x="772.5" y="141" text-anchor="middle" font-size="13" fill="#3a4859">conversation and</text><text x="772.5" y="159" text-anchor="middle" font-size="13" fill="#3a4859">quotes evidence</text><rect x="685" y="210" width="175" height="82" rx="10" fill="#e9f6ee" stroke="#3f9463" stroke-width="1.5"/><text x="772.5" y="236" text-anchor="middle" font-size="16" font-weight="700" fill="#1b2735">Two people</text><text x="772.5" y="258" text-anchor="middle" font-size="13" fill="#3a4859">score app chats blind,</text><text x="772.5" y="276" text-anchor="middle" font-size="13" fill="#3a4859">check the judge</text><rect x="930" y="130" width="145" height="110" rx="10" fill="#f3f5f7" stroke="#8a97a6" stroke-width="1.5"/><text x="1002.5" y="156" text-anchor="middle" font-size="16" font-weight="700" fill="#1b2735">Results</text><text x="1002.5" y="178" text-anchor="middle" font-size="13" fill="#3a4859">scores, transcripts,</text><text x="1002.5" y="196" text-anchor="middle" font-size="13" fill="#3a4859">how far to trust</text><text x="1002.5" y="214" text-anchor="middle" font-size="13" fill="#3a4859">the judge</text><line x1="175" y1="125" x2="223" y2="125" stroke="#44546a" stroke-width="1.8" marker-end="url(#a)"/><line x1="447" y1="125" x2="498" y2="125" stroke="#44546a" stroke-width="1.8" marker-end="url(#a)" marker-start="url(#a)"/><line x1="645" y1="125" x2="683" y2="125" stroke="#44546a" stroke-width="1.8" marker-end="url(#a)"/><line x1="860" y1="140" x2="928" y2="170" stroke="#44546a" stroke-width="1.8" marker-end="url(#a)"/><line x1="860" y1="250" x2="928" y2="215" stroke="#44546a" stroke-width="1.8" marker-end="url(#a)"/><path d="M572 177 L572 251 L683 251" fill="none" stroke="#44546a" stroke-width="1.8" marker-end="url(#a)"/></svg>