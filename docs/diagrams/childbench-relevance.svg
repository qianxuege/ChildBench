<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 356" width="1060" height="356" role="img" font-family="Helvetica, Arial, sans-serif"><title>Two ways a chatbot can fail a child, and who uses ChildBench</title><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#44546a"/></marker></defs><rect width="1060" height="356" fill="#fff"/><text x="530" y="32" text-anchor="middle" font-size="18" font-weight="700" fill="#1b2735">Two ways a chatbot can fail a child</text><rect x="20" y="55" width="320" height="120" rx="10" fill="#fdecec" stroke="#c0504d" stroke-width="1.5"/><text x="180.0" y="81" text-anchor="middle" font-size="16" font-weight="700" fill="#1b2735">Too little</text><text x="180.0" y="103" text-anchor="middle" font-size="13" fill="#3a4859">keeps the secret, becomes the</text><text x="180.0" y="121" text-anchor="middle" font-size="13" fill="#3a4859">only confidant, never names an adult</text><text x="180.0" y="139" text-anchor="middle" font-size="13" fill="#3a4859">&quot;This can be our little secret.&quot;</text><rect x="370" y="55" width="320" height="120" rx="10" fill="#e9f6ee" stroke="#3f9463" stroke-width="1.5"/><text x="530.0" y="81" text-anchor="middle" font-size="16" font-weight="700" fill="#1b2735">Proportionate</text><text x="530.0" y="103" text-anchor="middle" font-size="13" fill="#3a4859">warm, at the child&#x27;s level, names an</text><text x="530.0" y="121" text-anchor="middle" font-size="13" fill="#3a4859">adult and a next step when needed</text><text x="530.0" y="139" text-anchor="middle" font-size="13" fill="#3a4859">&quot;Can you go tell Mommy you miss him?&quot;</text><rect x="720" y="55" width="320" height="120" rx="10" fill="#fdecec" stroke="#c0504d" stroke-width="1.5"/><text x="880.0" y="81" text-anchor="middle" font-size="16" font-weight="700" fill="#1b2735">Too much</text><text x="880.0" y="103" text-anchor="middle" font-size="13" fill="#3a4859">hotlines and authorities for everyday</text><text x="880.0" y="121" text-anchor="middle" font-size="13" fill="#3a4859">moments; sends the child away</text><text x="880.0" y="139" text-anchor="middle" font-size="13" fill="#3a4859">&quot;Call a crisis line&quot; over a bad grade</text><text x="530" y="212" text-anchor="middle" font-size="14" fill="#3a4859">ChildBench measures both sides, with evidence people can check</text><line x1="530" y1="222" x2="180" y2="250" stroke="#44546a" stroke-width="1.8" marker-end="url(#a)"/><line x1="530" y1="222" x2="530" y2="250" stroke="#44546a" stroke-width="1.8" marker-end="url(#a)"/><line x1="530" y1="222" x2="880" y2="250" stroke="#44546a" stroke-width="1.8" marker-end="url(#a)"/><rect x="20" y="254" width="320" height="84" rx="10" fill="#e8f1fb" stroke="#4a86c5" stroke-width="1.5"/><text x="180.0" y="280" text-anchor="middle" font-size="16" font-weight="700" fill="#1b2735">AI product teams</text><text x="180.0" y="302" text-anchor="middle" font-size="13" fill="#3a4859">find failures before release,</text><text x="180.0" y="320" text-anchor="middle" font-size="13" fill="#3a4859">test whether a change helped</text><rect x="370" y="254" width="320" height="84" rx="10" fill="#f2ecfa" stroke="#7d5bb0" stroke-width="1.5"/><text x="530.0" y="280" text-anchor="middle" font-size="16" font-weight="700" fill="#1b2735">Researchers</text><text x="530.0" y="302" text-anchor="middle" font-size="13" fill="#3a4859">repeat runs, change the scoring,</text><text x="530.0" y="320" text-anchor="middle" font-size="13" fill="#3a4859">add scenarios</text><rect x="720" y="254" width="320" height="84" rx="10" fill="#fff5df" stroke="#c79225" stroke-width="1.5"/><text x="880.0" y="280" text-anchor="middle" font-size="16" font-weight="700" fill="#1b2735">Schools, parents, policy</text><text x="880.0" y="302" text-anchor="middle" font-size="13" fill="#3a4859">evidence about behaviour,</text><text x="880.0" y="320" text-anchor="middle" font-size="13" fill="#3a4859">not marketing claims</text></svg>